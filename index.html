<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Entry Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#040A18">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================
     HOLOGRAPHIC DIGITAL SCANNER
     deep navy ground / cyan light / one scan beam
     ============================================ */
  :root{
    --bg:#040A18;
    --panel:rgba(9,20,45,.78);
    --line:rgba(56,240,255,.30);
    --line-soft:rgba(56,240,255,.14);
    --cyan:#38F0FF;
    --cyan-ice:#A6F8FF;
    --ink:#D9F7FF;
    --dim:#7FA8BD;
    --ok:#4DFFB8;
    --bad:#FF5C8A;
    --ui:'Chakra Petch','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  }

  html{background:var(--bg)}
  body{
    font-family:var(--ui);color:var(--ink);
    margin:0 auto;padding:20px;max-width:430px;min-height:100vh;box-sizing:border-box;
    -webkit-font-smoothing:antialiased;
  }
  /* faint projection grid + top glow, fixed behind everything */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 480px at 50% -8%,rgba(56,240,255,.14),transparent 65%),
      linear-gradient(rgba(56,240,255,.035) 1px,transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg,rgba(56,240,255,.035) 1px,transparent 1px) 0 0/32px 32px;
  }

  /* ---------- scanner header (the one loud element) ---------- */
  .scanner{
    --scan:var(--cyan);--spd:3.4s;--pulse:1.8s;
    position:relative;margin-bottom:16px;padding:14px 14px 12px;
    border:1px solid var(--line);border-radius:6px;
    background:linear-gradient(180deg,rgba(56,240,255,.08),rgba(56,240,255,.015));
    box-shadow:inset 0 0 32px rgba(56,240,255,.06),0 0 26px rgba(56,240,255,.09);
  }
  .scanner[data-state="busy"]{--spd:1.1s;--pulse:.5s}
  .scanner[data-state="ok"]{--scan:var(--ok)}
  .scanner[data-state="error"]{--scan:var(--bad)}

  .scanner__view{position:relative;height:64px;overflow:hidden}
  /* reticle corners */
  .scanner__view::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(var(--scan),var(--scan)) top left/14px 2px no-repeat,
      linear-gradient(var(--scan),var(--scan)) top left/2px 14px no-repeat,
      linear-gradient(var(--scan),var(--scan)) top right/14px 2px no-repeat,
      linear-gradient(var(--scan),var(--scan)) top right/2px 14px no-repeat,
      linear-gradient(var(--scan),var(--scan)) bottom left/14px 2px no-repeat,
      linear-gradient(var(--scan),var(--scan)) bottom left/2px 14px no-repeat,
      linear-gradient(var(--scan),var(--scan)) bottom right/14px 2px no-repeat,
      linear-gradient(var(--scan),var(--scan)) bottom right/2px 14px no-repeat;
  }
  .scanner__bars{position:absolute;top:0;bottom:0;left:0;width:100%;color:var(--scan);opacity:.24}
  .scanner__bars svg{display:block;width:100%;height:100%}

  /* lit window: a 28%-wide slice that shows the bars at full brightness */
  .scanner__band{
    position:absolute;top:0;bottom:0;left:0;width:28%;overflow:hidden;
    background:linear-gradient(90deg,transparent,rgba(56,240,255,.18));
    background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--scan) 26%,transparent));
    animation:bandMove var(--spd) ease-in-out infinite alternate;
  }
  .scanner__bars--lit{
    width:calc(100% / .28);opacity:1;
    filter:drop-shadow(0 0 3px var(--scan));
    animation:bandInner var(--spd) ease-in-out infinite alternate;
  }
  .scanner__beam{
    position:absolute;top:0;bottom:0;width:2px;left:calc(28% - 2px);
    background:var(--scan);box-shadow:0 0 12px 3px var(--scan);
    animation:beamMove var(--spd) ease-in-out infinite alternate;
  }
  @keyframes bandMove{from{left:0}to{left:72%}}
  @keyframes bandInner{from{left:0}to{left:-257.142857%}}
  @keyframes beamMove{from{left:calc(28% - 2px)}to{left:calc(100% - 2px)}}

  .scanner__status{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;font-weight:500}
  .scanner__dot{
    flex:none;width:9px;height:9px;border-radius:50%;background:var(--scan);
    box-shadow:0 0 10px 2px var(--scan);
    animation:pulse var(--pulse) ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- top tabs ---------- */
  .topnav{display:flex;gap:8px;margin-bottom:16px}

  /* ---------- panels ---------- */
  .card{
    position:relative;margin-bottom:16px;padding:20px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:inset 0 0 40px rgba(56,240,255,.04),0 14px 40px rgba(0,0,0,.45),0 0 24px rgba(56,240,255,.07);
  }
  .card::before{
    content:"";position:absolute;inset:-1px;pointer-events:none;border-radius:6px;
    background:
      linear-gradient(var(--cyan),var(--cyan)) top left/16px 2px no-repeat,
      linear-gradient(var(--cyan),var(--cyan)) top left/2px 16px no-repeat,
      linear-gradient(var(--cyan),var(--cyan)) top right/16px 2px no-repeat,
      linear-gradient(var(--cyan),var(--cyan)) top right/2px 16px no-repeat,
      linear-gradient(var(--cyan),var(--cyan)) bottom left/16px 2px no-repeat,
      linear-gradient(var(--cyan),var(--cyan)) bottom left/2px 16px no-repeat,
      linear-gradient(var(--cyan),var(--cyan)) bottom right/16px 2px no-repeat,
      linear-gradient(var(--cyan),var(--cyan)) bottom right/2px 16px no-repeat;
    filter:drop-shadow(0 0 4px rgba(56,240,255,.7));
  }
  .view{display:none}
  .view.active{display:block}

  h2{
    margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:.01em;color:var(--ink);
    text-shadow:0 0 14px rgba(56,240,255,.4);
  }
  .backBtn + h2,.rowBtns + h2{margin-top:18px}
  .rowBtns h2{margin-bottom:14px}

  label{display:block;margin-top:16px;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--dim)}

  /* ---------- inputs ---------- */
  input{
    width:100%;box-sizing:border-box;margin-top:6px;padding:12px;
    font-family:var(--ui);font-size:16px;color:var(--ink);caret-color:var(--cyan);
    background:rgba(3,9,22,.85);border:1px solid var(--line);border-radius:4px;
    transition:border-color .15s,box-shadow .15s;
  }
  input::placeholder{color:var(--dim)}
  input:focus{
    outline:none;border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(56,240,255,.16),0 0 18px rgba(56,240,255,.3);
  }
  #productCode{font-family:var(--mono);font-size:17px;letter-spacing:.08em}

  .inputRow{display:flex;gap:8px;align-items:stretch;margin-top:6px}
  .inputRow input{flex:1;min-width:0;margin-top:0}
  .inputRow button{width:auto;min-width:120px;margin-top:0;padding:0 18px;white-space:nowrap}

  /* live product identification readout */
  .readout{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:20px;font-size:13px;color:var(--dim)}
  .readout__dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .15s,box-shadow .15s}
  .readout.has .readout__dot{background:var(--cyan);box-shadow:0 0 8px 1px var(--cyan)}
  .readout.has .readout__code{color:var(--cyan);font-family:var(--mono);font-size:15px;letter-spacing:.1em}
  .readout__meta{margin-left:auto;font-size:12.5px}

  /* ---------- buttons ---------- */
  button{
    width:100%;margin-top:12px;padding:13px;
    font-family:var(--ui);font-size:15px;font-weight:600;letter-spacing:.02em;
    color:#03121C;cursor:pointer;
    background:linear-gradient(135deg,#38F0FF,#8DF6EE);
    border:1px solid var(--cyan);border-radius:4px;
    box-shadow:0 0 18px rgba(56,240,255,.35);
    transition:box-shadow .15s,transform .05s,background .15s;
  }
  button:hover{box-shadow:0 0 26px rgba(56,240,255,.6)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:default;box-shadow:none}
  button:focus-visible,.chip:focus-visible{outline:2px solid var(--cyan-ice);outline-offset:2px}

  .topnav button,.backBtn,.refreshBtn{
    margin-top:0;color:var(--cyan);background:transparent;
    border-color:var(--line);box-shadow:none;
  }
  .topnav button:hover,.backBtn:hover,.refreshBtn:hover{
    background:rgba(56,240,255,.08);border-color:var(--cyan);box-shadow:0 0 16px rgba(56,240,255,.25);
  }
  .topnav button.active{
    color:var(--cyan-ice);background:rgba(56,240,255,.14);border-color:var(--cyan);
    box-shadow:0 0 18px rgba(56,240,255,.35);text-shadow:0 0 10px rgba(56,240,255,.6);
  }
  .backBtn{margin-bottom:0}
  .refreshBtn{margin-bottom:0}
  .rowBtns{display:flex;gap:8px}
  .rowBtns button{margin-top:0}
  .dangerBtn{
    color:var(--bad);background:transparent;border-color:var(--bad);
    box-shadow:0 0 14px rgba(255,92,138,.22);
  }
  .dangerBtn:hover{background:rgba(255,92,138,.1);box-shadow:0 0 24px rgba(255,92,138,.45)}

  /* ---------- selectable rows (departments, staff) ---------- */
  #deptButtons button,.listItem{
    position:relative;display:flex;justify-content:space-between;align-items:center;
    margin-top:10px;padding:14px 14px 14px 20px;text-align:left;
    font-weight:500;font-size:16px;color:var(--ink);
    background:rgba(56,240,255,.05);border:1px solid var(--line);box-shadow:none;
  }
  #deptButtons button::before,.listItem::before{
    content:"";position:absolute;left:0;top:50%;width:3px;height:18px;transform:translateY(-50%);
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);border-radius:0 2px 2px 0;
    transition:height .15s;
  }
  #deptButtons button:hover,.listItem:hover{
    background:rgba(56,240,255,.1);border-color:var(--cyan);box-shadow:0 0 18px rgba(56,240,255,.22);
  }
  #deptButtons button:hover::before,.listItem:hover::before{height:70%}
  .listItem .count{
    float:none;padding:1px 10px;font-family:var(--mono);font-size:13px;font-weight:500;
    color:var(--cyan);border:1px solid var(--cyan);border-radius:999px;
    box-shadow:0 0 10px rgba(56,240,255,.3);
  }

  /* ---------- messages ---------- */
  #status,#itStatus{display:none;margin-top:16px;padding:10px 12px;border-radius:4px;font-size:14px}
  .success{background:rgba(77,255,184,.10);color:var(--ok);border:1px solid rgba(77,255,184,.4)}
  .error{background:rgba(255,92,138,.10);color:var(--bad);border:1px solid rgba(255,92,138,.4)}

  .empty{text-align:center;color:var(--dim);padding:24px 0}
  .loading{text-align:center;color:var(--dim);padding:26px 0 18px;font-size:14px}
  .loading::before{
    content:"";display:block;width:140px;height:2px;margin:0 auto 14px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent) 0 0/60% 100% no-repeat,var(--line-soft);
    box-shadow:0 0 10px rgba(56,240,255,.45);
    animation:loadSweep 1.1s ease-in-out infinite alternate;
  }
  @keyframes loadSweep{from{background-position:0 0,0 0}to{background-position:100% 0,0 0}}

  /* ---------- filter chips ---------- */
  .chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{
    padding:6px 12px;font-size:14px;color:var(--cyan);cursor:pointer;
    border:1px solid var(--line);border-radius:4px;background:transparent;
    transition:background .15s,box-shadow .15s;
  }
  .chip:hover{background:rgba(56,240,255,.1);border-color:var(--cyan)}
  .chip.active{color:#03121C;font-weight:600;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 16px rgba(56,240,255,.5)}

  /* ---------- entries table ---------- */
  .tableWrap{overflow-x:auto;margin-top:6px}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  th{padding:8px 6px;text-align:left;font-size:12.5px;font-weight:500;color:var(--dim);border-bottom:1px solid var(--line)}
  td{padding:10px 6px;color:var(--ink);border-bottom:1px solid var(--line-soft)}
  td.code{font-family:var(--mono);font-size:13.5px;letter-spacing:.04em;color:var(--cyan);white-space:nowrap}
  td.time{font-size:12.5px;color:var(--dim)}
  .qtyTag{
    display:inline-block;min-width:26px;padding:1px 6px;text-align:center;
    font-family:var(--mono);color:var(--cyan-ice);border:1px solid var(--line);border-radius:3px;
    background:rgba(56,240,255,.08);
  }

  /* ---------- reduced motion: hold the beam mid-scan ---------- */
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .scanner__band{left:36%}
    .scanner__bars--lit{left:-128.571429%}
    .scanner__beam{left:calc(64% - 2px)}
  }
</style>
</head>
<body>

<!-- SCANNER HEADER -->
<header class="scanner" id="scanner" data-state="ready">
  <div class="scanner__view" aria-hidden="true">
    <div class="scanner__bars" id="barsBase"></div>
    <div class="scanner__band">
      <div class="scanner__bars scanner__bars--lit" id="barsLit"></div>
    </div>
    <div class="scanner__beam"></div>
  </div>
  <div class="scanner__status" role="status" aria-live="polite">
    <span class="scanner__dot"></span>
    <span id="scanText">Ready to scan</span>
  </div>
</header>

<div class="topnav">
  <button id="tabDept" class="active" onclick="switchTab('dept')">Select Department</button>
  <button id="tabIT" onclick="switchTab('it')">IT Entry</button>
</div>

<!-- DEPARTMENT SELECT -->
<div id="view-dept-select" class="view active card">
  <h2>Select Department</h2>
  <div id="deptButtons"></div>
</div>

<!-- ENTRY FORM -->
<div id="view-dept-form" class="view card">
  <button class="backBtn" onclick="showDeptSelect()">&larr; Change Department</button>
  <h2 id="deptName"></h2>

  <label>Staff Name</label>
  <input id="staffName" list="staffList" autocomplete="off">
  <datalist id="staffList"></datalist>

  <label>Product Code</label>
  <div class="inputRow">
    <input id="productCode" autocomplete="off">
    <button id="submitBtn" onclick="submitForm()">Submit</button>
  </div>
  <div class="readout" id="codeReadout">
    <span class="readout__dot"></span>
    <span class="readout__code" id="codeText">Waiting for scan</span>
    <span class="readout__meta" id="codeMeta"></span>
  </div>

  <label>Quantity</label>
  <input id="quantity" type="number" value="1" min="1">

  <div id="status"></div>
</div>

<!-- IT ENTRY: STAFF LIST -->
<div id="view-it-list" class="view card">
  <div class="rowBtns">
    <h2 style="flex:1">IT Entry</h2>
  </div>
  <button class="refreshBtn" onclick="showITList(true)">&#8635; Refresh</button>
  <div id="staffListContainer"></div>
</div>

<!-- IT ENTRY: STAFF DETAIL -->
<div id="view-it-detail" class="view card">
  <div class="rowBtns">
    <button class="backBtn" onclick="showITList()">&larr; Back</button>
    <button class="refreshBtn" onclick="renderStaffDetail(true)">&#8635; Refresh</button>
  </div>
  <h2 id="itStaffName"></h2>

  <label>Filter by Quantity</label>
  <div id="qtyChips" class="chipRow"></div>

  <button id="copyBatchBtn" onclick="copyBatch()">Copy Batch (Product Codes)</button>
  <button id="clearStaffBtn" class="dangerBtn" onclick="clearStaffData()">Clear All Data for This Staff</button>

  <div id="itStatus"></div>

  <div class="tableWrap">
    <table>
      <thead>
        <tr><th>Department</th><th>Product Code</th><th>Qty</th><th>Time</th></tr>
      </thead>
      <tbody id="entryRows"></tbody>
    </table>
  </div>
  <div id="itEmpty" class="empty" style="display:none">No entries.</div>
</div>

<script>
//========================================
// CONFIG
//========================================
// Paste the /exec URL from your deployed Apps Script Web App below.
const API_URL = "https://script.google.com/macros/s/AKfycby4vP80h3Q7TSiw7zCcDhvujS7M-t9qn7GKcKdF3DPV6wJ1a57O6Ai78LG11sImPYc/exec";

const DEPARTMENTS = ["Food", "Nonfood", "Fresh Market", "Hardline", "Softline"];

let currentDepartment = "";
let currentStaff = "";
let currentQtyFilter = null; // null = All
let entriesCache = [];
let currentViewId = "view-dept-select";

//========================================
// SCANNER STATUS
// states: ready | busy | ok | error
//========================================
const scannerEl = document.getElementById("scanner");
const scanTextEl = document.getElementById("scanText");
let scanTimer = null;

function defaultScanText() {
  return currentViewId.indexOf("view-it") === 0 ? "Entries loaded" : "Ready to scan";
}

function setScan(state, text, revertMs) {
  scannerEl.dataset.state = state;
  scanTextEl.textContent = text;
  clearTimeout(scanTimer);
  if (revertMs) {
    scanTimer = setTimeout(() => setScan("ready", defaultScanText()), revertMs);
  }
}

// Decorative barcode: deterministic bar/space widths so it looks the same every load
function buildBars(el) {
  let seed = 7, x = 0, isBar = true, rects = "";
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  while (x < 240) {
    const w = 1 + Math.floor(rnd() * 4);
    if (isBar && x + w <= 240) rects += '<rect x="' + x + '" y="0" width="' + w + '" height="64"/>';
    x += w;
    isBar = !isBar;
  }
  el.innerHTML = '<svg viewBox="0 0 240 64" preserveAspectRatio="none" fill="currentColor">' + rects + "</svg>";
}

//========================================
// SERVER HELPERS
// The server caches "list"/"summary" reads for ~20s (see CACHE_TTL_SECONDS
// in Code.gs), so plain loads are fast. Pass force=true to bypass that
// cache when the data must be current right now (manual Refresh taps).
//========================================
async function fetchSummary(force) {
  const url = API_URL + "?action=summary" + (force ? "&nocache=1" : "");
  const res = await fetch(url);
  const data = await res.json();
  if (!data.success) throw new Error(data.message || "Failed to load data.");
  return data.staff || []; // [{ staffName, count }]
}

async function fetchStaffEntries(name, force) {
  const url = API_URL + "?action=list&staff=" + encodeURIComponent(name) + (force ? "&nocache=1" : "");
  const res = await fetch(url);
  const data = await res.json();
  if (!data.success) throw new Error(data.message || "Failed to load data.");
  entriesCache = data.entries || [];
  return entriesCache;
}

async function postToServer(payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return res.json();
}

function getEntriesForStaff(name) {
  // entriesCache only ever holds the currently opened staff's rows
  return entriesCache.filter(e => e.staffName === name);
}

//========================================
// TOP NAV
//========================================
function switchTab(tab) {
  document.getElementById("tabDept").classList.toggle("active", tab === "dept");
  document.getElementById("tabIT").classList.toggle("active", tab === "it");

  if (tab === "dept") {
    showDeptSelect();
  } else {
    showITList();
  }
}

function showView(id) {
  currentViewId = id;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  setScan("ready", defaultScanText());
}

//========================================
// DEPARTMENT FLOW
//========================================
function initDeptButtons() {
  const container = document.getElementById("deptButtons");
  container.innerHTML = "";
  DEPARTMENTS.forEach(d => {
    const b = document.createElement("button");
    b.textContent = d;
    b.onclick = () => selectDepartment(d);
    container.appendChild(b);
  });
}

async function selectDepartment(dept) {
  currentDepartment = dept;
  document.getElementById("deptName").textContent = dept;
  document.getElementById("status").style.display = "none";
  showView("view-dept-form");
  try {
    const staff = await fetchSummary(false);
    refreshStaffDatalist(staff.map(s => s.staffName));
  } catch (e) {
    // datalist just won't have suggestions if this fails; not fatal
  }
}

function showDeptSelect() {
  showView("view-dept-select");
}

function refreshStaffDatalist(names) {
  const list = document.getElementById("staffList");
  list.innerHTML = "";
  names.forEach(n => {
    const o = document.createElement("option");
    o.value = n;
    list.appendChild(o);
  });
}

//========================================
// PRODUCT CODE READOUT
//========================================
function formatCode(v) {
  // 13-digit codes are grouped like they print on the pack: 9 556001 325945
  return /^\d{13}$/.test(v) ? v.slice(0, 1) + " " + v.slice(1, 7) + " " + v.slice(7) : v;
}

function updateReadout() {
  const v = document.getElementById("productCode").value.trim();
  const box = document.getElementById("codeReadout");
  const text = document.getElementById("codeText");
  const meta = document.getElementById("codeMeta");

  if (v === "") {
    box.classList.remove("has");
    text.textContent = "Waiting for scan";
    meta.textContent = "";
  } else {
    box.classList.add("has");
    text.textContent = formatCode(v);
    meta.textContent = v.length + (/^\d+$/.test(v) ? " digits" : " characters");
  }

  if (scannerEl.dataset.state === "busy") return;
  setScan("ready", v === "" ? defaultScanText() : "Code captured");
}

async function submitForm() {
  const status = document.getElementById("status");
  status.style.display = "none";

  const staffName = document.getElementById("staffName").value.trim();
  const productCode = document.getElementById("productCode").value.trim();
  const quantity = Number(document.getElementById("quantity").value);

  if (staffName === "") {
    setScan("error", "Missing details", 2500);
    return showStatus(status, false, "Please enter Staff Name.");
  }
  if (productCode === "") {
    setScan("error", "Missing details", 2500);
    return showStatus(status, false, "Please scan Product Code.");
  }
  if (!(quantity > 0)) {
    setScan("error", "Missing details", 2500);
    return showStatus(status, false, "Quantity must be at least 1.");
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";
  setScan("busy", "Submitting...");

  try {
    const result = await postToServer({
      action: "submit",
      staffName,
      department: currentDepartment,
      productCode,
      quantity
    });

    if (result.success) {
      showStatus(status, true, result.message + " (" + result.timestamp + ")");
      document.getElementById("productCode").value = "";
      document.getElementById("quantity").value = 1;
      updateReadout();
      document.getElementById("productCode").focus();
      setScan("ok", "Submitted", 2200);
    } else {
      showStatus(status, false, result.message);
      setScan("error", "Not submitted", 3000);
    }
  } catch (e) {
    showStatus(status, false, "Connection error. Please try again.");
    setScan("error", "Connection problem", 3000);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
  }
}

function showStatus(el, success, message) {
  el.style.display = "block";
  el.className = success ? "success" : "error";
  el.innerHTML = (success ? "✓ " : "✗ ") + message;
}

//========================================
// IT ENTRY: STAFF LIST
//========================================
async function showITList(force) {
  showView("view-it-list");
  setScan("busy", "Loading entries...");
  const container = document.getElementById("staffListContainer");
  container.innerHTML = '<div class="loading">Loading...</div>';

  let staff;
  try {
    staff = await fetchSummary(!!force);
  } catch (e) {
    container.innerHTML = '<div class="empty">Could not load data. Check your connection and tap Refresh.</div>';
    setScan("error", "Connection problem");
    return;
  }

  container.innerHTML = "";

  if (staff.length === 0) {
    container.innerHTML = '<div class="empty">No submissions yet.</div>';
  } else {
    staff.forEach(s => {
      const b = document.createElement("button");
      b.className = "listItem";
      b.innerHTML = "<span>" + escapeHtml(s.staffName) + '</span><span class="count">' + s.count + "</span>";
      b.onclick = () => openStaffDetail(s.staffName);
      container.appendChild(b);
    });
  }
  setScan("ready", "Entries loaded");
}

//========================================
// IT ENTRY: STAFF DETAIL
//========================================
async function openStaffDetail(name) {
  currentStaff = name;
  currentQtyFilter = null;
  document.getElementById("itStaffName").textContent = name;
  document.getElementById("itStatus").style.display = "none";
  document.getElementById("qtyChips").innerHTML = "";
  document.getElementById("entryRows").innerHTML = "";
  document.getElementById("itEmpty").style.display = "none";
  showView("view-it-detail");
  setScan("busy", "Loading entries...");

  try {
    await fetchStaffEntries(name, false);
  } catch (e) {
    document.getElementById("itStatus").style.display = "block";
    document.getElementById("itStatus").className = "error";
    document.getElementById("itStatus").innerHTML = "✗ Could not load entries. Check your connection.";
    setScan("error", "Connection problem");
    return;
  }

  renderStaffDetail(false);
  setScan("ready", "Entries loaded");
}

function makeChip(label, active, onPick) {
  const chip = document.createElement("div");
  chip.className = "chip" + (active ? " active" : "");
  chip.textContent = label;
  chip.tabIndex = 0;
  chip.setAttribute("role", "button");
  chip.setAttribute("aria-pressed", active ? "true" : "false");
  chip.onclick = onPick;
  chip.onkeydown = ev => {
    if (ev.key === "Enter" || ev.key === " ") {
      ev.preventDefault();
      onPick();
    }
  };
  return chip;
}

async function renderStaffDetail(refetch) {
  if (refetch) {
    document.getElementById("entryRows").innerHTML = "";
    document.getElementById("itEmpty").style.display = "none";
    setScan("busy", "Loading entries...");
    try {
      await fetchStaffEntries(currentStaff, true);
    } catch (e) {
      document.getElementById("itStatus").style.display = "block";
      document.getElementById("itStatus").className = "error";
      document.getElementById("itStatus").innerHTML = "✗ Could not refresh. Check your connection.";
      setScan("error", "Connection problem");
      return;
    }
    setScan("ready", "Entries loaded");
  }

  const entries = getEntriesForStaff(currentStaff);

  // quantity filter chips
  const quantities = [...new Set(entries.map(e => e.quantity))].sort((a, b) => a - b);
  const chipRow = document.getElementById("qtyChips");
  chipRow.innerHTML = "";

  chipRow.appendChild(makeChip("All", currentQtyFilter === null, () => {
    currentQtyFilter = null;
    renderStaffDetail(false);
  }));

  quantities.forEach(q => {
    chipRow.appendChild(makeChip("Qty " + q, currentQtyFilter === q, () => {
      currentQtyFilter = q;
      renderStaffDetail(false);
    }));
  });

  // filtered rows
  const filtered = currentQtyFilter === null
    ? entries
    : entries.filter(e => e.quantity === currentQtyFilter);

  const tbody = document.getElementById("entryRows");
  tbody.innerHTML = "";
  document.getElementById("itEmpty").style.display = filtered.length === 0 ? "block" : "none";

  filtered.forEach(e => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + escapeHtml(e.department) + "</td>" +
      '<td class="code">' + escapeHtml(e.productCode) + "</td>" +
      '<td><span class="qtyTag">' + e.quantity + "</span></td>" +
      '<td class="time">' + escapeHtml(e.timestamp) + "</td>";
    tbody.appendChild(tr);
  });

  document.getElementById("copyBatchBtn").textContent =
    "Copy Batch (" + filtered.length + " code" + (filtered.length === 1 ? "" : "s") + ")";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function copyBatch() {
  const entries = getEntriesForStaff(currentStaff);
  const filtered = currentQtyFilter === null
    ? entries
    : entries.filter(e => e.quantity === currentQtyFilter);

  const codes = filtered.map(e => e.productCode).join("\n");
  const status = document.getElementById("itStatus");

  if (filtered.length === 0) {
    status.style.display = "block";
    status.className = "error";
    status.innerHTML = "✗ Nothing to copy for this filter.";
    return;
  }

  const done = () => {
    status.style.display = "block";
    status.className = "success";
    status.innerHTML = "✓ Copied " + filtered.length + " product code(s).";
    setScan("ok", "Copied", 1800);
  };
  const fail = () => {
    status.style.display = "block";
    status.className = "error";
    status.innerHTML = "✗ Could not copy automatically. Long-press to copy manually.";
    setScan("error", "Copy failed", 2500);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(codes).then(done).catch(fail);
  } else {
    try {
      const ta = document.createElement("textarea");
      ta.value = codes;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) {
      fail();
    }
  }
}

async function clearStaffData() {
  const confirmed = confirm(
    "Clear ALL submitted data for \"" + currentStaff + "\"? This cannot be undone."
  );
  if (!confirmed) return;

  const clearBtn = document.getElementById("clearStaffBtn");
  const status = document.getElementById("itStatus");
  status.style.display = "none";

  clearBtn.disabled = true;
  clearBtn.textContent = "Deleting...";
  setScan("busy", "Deleting...");

  try {
    const result = await postToServer({ action: "clearStaff", staffName: currentStaff });
    if (!result.success) {
      status.style.display = "block";
      status.className = "error";
      status.innerHTML = "✗ " + (result.message || "Could not clear data.");
      setScan("error", "Not deleted", 3000);
      return;
    }
    showITList();
  } catch (e) {
    status.style.display = "block";
    status.className = "error";
    status.innerHTML = "✗ Connection error. Please try again.";
    setScan("error", "Connection problem", 3000);
  } finally {
    clearBtn.disabled = false;
    clearBtn.textContent = "Clear All Data for This Staff";
  }
}
