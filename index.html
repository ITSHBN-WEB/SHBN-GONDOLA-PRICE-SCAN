<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Entry Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:20px;max-width:430px;margin-left:auto;margin-right:auto}
  .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);margin-bottom:16px}
  h2{text-align:center;margin-top:0}
  button{width:100%;padding:14px;margin-top:12px;font-size:16px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-weight:bold;cursor:pointer}
  button:active{opacity:.85}
  input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;margin-top:5px;font-size:15px}
  label{display:block;margin-top:14px;font-weight:bold}
  #status{display:none;margin-top:15px;padding:10px;border-radius:8px;text-align:center}
  .success{background:#d4edda;color:#155724}
  .error{background:#f8d7da;color:#721c24}
  .smallBtn{background:#666}
  .dangerBtn{background:#c0392b}
  .view{display:none}
  .view.active{display:block}

  /* top nav */
  .topnav{display:flex;gap:8px;margin-bottom:16px}
  .topnav button{margin-top:0;background:#e3e9f2;color:#1a3d7c}
  .topnav button.active{background:#1a73e8;color:#fff}

  /* IT entry list */
  .listItem{width:100%;text-align:left;padding:14px;margin-top:10px;border-radius:8px;background:#eef2fa;color:#12305c;font-weight:bold;border:1px solid #d5dcec}
  .listItem .count{float:right;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:normal}
  .empty{text-align:center;color:#888;padding:20px 0}

  /* filter chips */
  .chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{padding:6px 12px;border-radius:16px;background:#eef2fa;border:1px solid #d5dcec;font-size:14px;cursor:pointer;color:#12305c}
  .chip.active{background:#1a73e8;color:#fff;border-color:#1a73e8}

  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee}
  th{color:#555;font-size:12px;text-transform:none}
  .tableWrap{overflow-x:auto}

  .backBtn{background:#666;margin-bottom:0}
</style>
</head>
<body>

<div class="topnav">
  <button id="tabDept" class="active" onclick="switchTab('dept')">Select Department</button>
  <button id="tabIT" onclick="switchTab('it')">IT Entry</button>
</div>

<!-- DEPARTMENT SELECT -->
<div id="view-dept-select" class="view active card">
  <h2>Select Department</h2>
  <div id="deptButtons"></div>
</div>

<!-- ENTRY FORM -->
<div id="view-dept-form" class="view card">
  <button class="backBtn" onclick="showDeptSelect()">&larr; Change Department</button>
  <h2 id="deptName"></h2>

  <label>Staff Name</label>
  <input id="staffName" list="staffList" autocomplete="off">
  <datalist id="staffList"></datalist>

  <label>Product Code</label>
  <input id="productCode" autocomplete="off">

  <label>Quantity</label>
  <input id="quantity" type="number" value="1" min="1">

  <button onclick="submitForm()">Submit</button>

  <div id="status"></div>
</div>

<!-- IT ENTRY: STAFF LIST -->
<div id="view-it-list" class="view card">
  <h2>IT Entry</h2>
  <div id="staffListContainer"></div>
</div>

<!-- IT ENTRY: STAFF DETAIL -->
<div id="view-it-detail" class="view card">
  <button class="backBtn" onclick="showITList()">&larr; Back to Staff List</button>
  <h2 id="itStaffName"></h2>

  <label>Filter by Quantity</label>
  <div id="qtyChips" class="chipRow"></div>

  <div class="tableWrap">
    <table>
      <thead>
        <tr><th>Department</th><th>Product Code</th><th>Qty</th><th>Time</th></tr>
      </thead>
      <tbody id="entryRows"></tbody>
    </table>
  </div>
  <div id="itEmpty" class="empty" style="display:none">No entries.</div>

  <button id="copyBatchBtn" onclick="copyBatch()">Copy Batch (Product Codes)</button>
  <button class="dangerBtn" onclick="clearStaffData()">Clear All Data for This Staff</button>

  <div id="itStatus" style="display:none;margin-top:15px;padding:10px;border-radius:8px;text-align:center"></div>
</div>

<script>
//========================================
// CONFIG
//========================================
const DEPARTMENTS = ["Food", "Nonfood", "Fresh Market", "Hardline", "Softline"];
const ENTRIES_KEY = "shbn_entries";

let currentDepartment = "";
let currentStaff = "";
let currentQtyFilter = null; // null = All

//========================================
// STORAGE HELPERS
//========================================
function loadEntries() {
  try {
    return JSON.parse(localStorage.getItem(ENTRIES_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveEntries(list) {
  localStorage.setItem(ENTRIES_KEY, JSON.stringify(list));
}

function addEntry(entry) {
  const list = loadEntries();
  list.push(entry);
  saveEntries(list);
}

function getStaffNames() {
  const list = loadEntries();
  const names = [...new Set(list.map(e => e.staffName))];
  return names.sort((a, b) => a.localeCompare(b));
}

function getEntriesForStaff(name) {
  return loadEntries().filter(e => e.staffName === name);
}

function clearStaffEntries(name) {
  const list = loadEntries().filter(e => e.staffName !== name);
  saveEntries(list);
}

//========================================
// TIMESTAMP
//========================================
function formatTimestamp(date) {
  const d = date.getDate();
  const m = date.getMonth() + 1;
  const y = date.getFullYear();
  let h = date.getHours();
  const min = date.getMinutes();
  const ampm = h >= 12 ? "pm" : "am";
  h = h % 12;
  if (h === 0) h = 12;
  const minStr = min < 10 ? "0" + min : "" + min;
  return `${d}.${m}.${y} ${h}.${minStr}${ampm}`;
}

//========================================
// TOP NAV
//========================================
function switchTab(tab) {
  document.getElementById("tabDept").classList.toggle("active", tab === "dept");
  document.getElementById("tabIT").classList.toggle("active", tab === "it");

  if (tab === "dept") {
    showDeptSelect();
  } else {
    showITList();
  }
}

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

//========================================
// DEPARTMENT FLOW
//========================================
function initDeptButtons() {
  const container = document.getElementById("deptButtons");
  container.innerHTML = "";
  DEPARTMENTS.forEach(d => {
    const b = document.createElement("button");
    b.textContent = d;
    b.onclick = () => selectDepartment(d);
    container.appendChild(b);
  });
}

function selectDepartment(dept) {
  currentDepartment = dept;
  document.getElementById("deptName").textContent = dept;
  document.getElementById("status").style.display = "none";
  refreshStaffDatalist();
  showView("view-dept-form");
}

function showDeptSelect() {
  showView("view-dept-select");
}

function refreshStaffDatalist() {
  const list = document.getElementById("staffList");
  list.innerHTML = "";
  getStaffNames().forEach(n => {
    const o = document.createElement("option");
    o.value = n;
    list.appendChild(o);
  });
}

function submitForm() {
  const status = document.getElementById("status");
  status.style.display = "none";

  const staffName = document.getElementById("staffName").value.trim();
  const productCode = document.getElementById("productCode").value.trim();
  const quantity = Number(document.getElementById("quantity").value);

  if (staffName === "") {
    return showStatus(status, false, "Please enter Staff Name.");
  }
  if (productCode === "") {
    return showStatus(status, false, "Please scan Product Code.");
  }
  if (!(quantity > 0)) {
    return showStatus(status, false, "Quantity must be at least 1.");
  }

  const timestamp = formatTimestamp(new Date());

  addEntry({
    staffName,
    department: currentDepartment,
    productCode,
    quantity,
    timestamp
  });

  showStatus(status, true, "Entry submitted! (" + timestamp + ")");

  document.getElementById("productCode").value = "";
  document.getElementById("quantity").value = 1;
  document.getElementById("productCode").focus();
}

function showStatus(el, success, message) {
  el.style.display = "block";
  el.className = success ? "success" : "error";
  el.innerHTML = (success ? "✓ " : "✗ ") + message;
}

//========================================
// IT ENTRY: STAFF LIST
//========================================
function showITList() {
  const container = document.getElementById("staffListContainer");
  container.innerHTML = "";

  const names = getStaffNames();

  if (names.length === 0) {
    container.innerHTML = '<div class="empty">No submissions yet.</div>';
  } else {
    names.forEach(name => {
      const count = getEntriesForStaff(name).length;
      const b = document.createElement("button");
      b.className = "listItem";
      b.innerHTML = name + '<span class="count">' + count + "</span>";
      b.onclick = () => openStaffDetail(name);
      container.appendChild(b);
    });
  }

  showView("view-it-list");
}

//========================================
// IT ENTRY: STAFF DETAIL
//========================================
function openStaffDetail(name) {
  currentStaff = name;
  currentQtyFilter = null;
  document.getElementById("itStaffName").textContent = name;
  document.getElementById("itStatus").style.display = "none";
  renderStaffDetail();
  showView("view-it-detail");
}

function renderStaffDetail() {
  const entries = getEntriesForStaff(currentStaff);

  // quantity filter chips
  const quantities = [...new Set(entries.map(e => e.quantity))].sort((a, b) => a - b);
  const chipRow = document.getElementById("qtyChips");
  chipRow.innerHTML = "";

  const allChip = document.createElement("div");
  allChip.className = "chip" + (currentQtyFilter === null ? " active" : "");
  allChip.textContent = "All";
  allChip.onclick = () => { currentQtyFilter = null; renderStaffDetail(); };
  chipRow.appendChild(allChip);

  quantities.forEach(q => {
    const chip = document.createElement("div");
    chip.className = "chip" + (currentQtyFilter === q ? " active" : "");
    chip.textContent = "Qty " + q;
    chip.onclick = () => { currentQtyFilter = q; renderStaffDetail(); };
    chipRow.appendChild(chip);
  });

  // filtered rows
  const filtered = currentQtyFilter === null
    ? entries
    : entries.filter(e => e.quantity === currentQtyFilter);

  const tbody = document.getElementById("entryRows");
  tbody.innerHTML = "";
  document.getElementById("itEmpty").style.display = filtered.length === 0 ? "block" : "none";

  filtered.forEach(e => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + escapeHtml(e.department) + "</td>" +
      "<td>" + escapeHtml(e.productCode) + "</td>" +
      "<td>" + e.quantity + "</td>" +
      "<td>" + escapeHtml(e.timestamp) + "</td>";
    tbody.appendChild(tr);
  });

  document.getElementById("copyBatchBtn").textContent =
    "Copy Batch (" + filtered.length + " code" + (filtered.length === 1 ? "" : "s") + ")";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function copyBatch() {
  const entries = getEntriesForStaff(currentStaff);
  const filtered = currentQtyFilter === null
    ? entries
    : entries.filter(e => e.quantity === currentQtyFilter);

  const codes = filtered.map(e => e.productCode).join("\n");
  const status = document.getElementById("itStatus");

  if (filtered.length === 0) {
    status.style.display = "block";
    status.className = "error";
    status.innerHTML = "✗ Nothing to copy for this filter.";
    return;
  }

  const done = () => {
    status.style.display = "block";
    status.className = "success";
    status.innerHTML = "✓ Copied " + filtered.length + " product code(s).";
  };
  const fail = () => {
    status.style.display = "block";
    status.className = "error";
    status.innerHTML = "✗ Could not copy automatically. Long-press to copy manually.";
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(codes).then(done).catch(fail);
  } else {
    try {
      const ta = document.createElement("textarea");
      ta.value = codes;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) {
      fail();
    }
  }
}

function clearStaffData() {
  const confirmed = confirm(
    "Clear ALL submitted data for \"" + currentStaff + "\"? This cannot be undone."
  );
  if (!confirmed) return;

  clearStaffEntries(currentStaff);
  showITList();
}

//========================================
// INIT
//========================================
initDeptButtons();
refreshStaffDatalist();
</script>

</body>
</html>
