<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Entry Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:20px;max-width:430px;margin-left:auto;margin-right:auto}
  .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);margin-bottom:16px}
  h2{text-align:center;margin-top:0}
  button{width:100%;padding:14px;margin-top:12px;font-size:16px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-weight:bold;cursor:pointer}
  button:active{opacity:.85}
  button:disabled{opacity:.6;cursor:default}
  input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;margin-top:5px;font-size:15px}
  label{display:block;margin-top:14px;font-weight:bold}
  #status{display:none;margin-top:15px;padding:10px;border-radius:8px;text-align:center}
  .success{background:#d4edda;color:#155724}
  .error{background:#f8d7da;color:#721c24}
  .smallBtn{background:#666}
  .dangerBtn{background:#c0392b}
  .refreshBtn{background:#e3e9f2;color:#1a3d7c;margin-bottom:0}
  .view{display:none}
  .view.active{display:block}

  /* top nav */
  .topnav{display:flex;gap:8px;margin-bottom:16px}
  .topnav button{margin-top:0;background:#e3e9f2;color:#1a3d7c}
  .topnav button.active{background:#1a73e8;color:#fff}

  /* IT entry list */
  .listItem{width:100%;text-align:left;padding:14px;margin-top:10px;border-radius:8px;background:#eef2fa;color:#12305c;font-weight:bold;border:1px solid #d5dcec}
  .listItem .count{float:right;background:#1a73e8;color:#fff;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:normal}
  .empty{text-align:center;color:#888;padding:20px 0}
  .loading{text-align:center;color:#888;padding:20px 0}

  /* filter chips */
  .chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{padding:6px 12px;border-radius:16px;background:#eef2fa;border:1px solid #d5dcec;font-size:14px;cursor:pointer;color:#12305c}
  .chip.active{background:#1a73e8;color:#fff;border-color:#1a73e8}

  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee}
  th{color:#555;font-size:12px;text-transform:none}
  .tableWrap{overflow-x:auto}

  .backBtn{background:#666;margin-bottom:0}
  .rowBtns{display:flex;gap:8px}
  .rowBtns button{margin-top:0}
</style>
</head>
<body>

<div class="topnav">
  <button id="tabDept" class="active" onclick="switchTab('dept')">Select Department</button>
  <button id="tabIT" onclick="switchTab('it')">IT Entry</button>
</div>

<!-- DEPARTMENT SELECT -->
<div id="view-dept-select" class="view active card">
  <h2>Select Department</h2>
  <div id="deptButtons"></div>
</div>

<!-- ENTRY FORM -->
<div id="view-dept-form" class="view card">
  <button class="backBtn" onclick="showDeptSelect()">&larr; Change Department</button>
  <h2 id="deptName"></h2>

  <label>Staff Name</label>
  <input id="staffName" list="staffList" autocomplete="off">
  <datalist id="staffList"></datalist>

  <label>Product Code</label>
  <input id="productCode" autocomplete="off">

  <label>Quantity</label>
  <input id="quantity" type="number" value="1" min="1">

  <button id="submitBtn" onclick="submitForm()">Submit</button>

  <div id="status"></div>
</div>

<!-- IT ENTRY: STAFF LIST -->
<div id="view-it-list" class="view card">
  <div class="rowBtns">
    <h2 style="flex:1">IT Entry</h2>
  </div>
  <button class="refreshBtn" onclick="showITList(true)">&#8635; Refresh</button>
  <div id="staffListContainer"></div>
</div>

<!-- IT ENTRY: STAFF DETAIL -->
<div id="view-it-detail" class="view card">
  <div class="rowBtns">
    <button class="backBtn" onclick="showITList()">&larr; Back</button>
    <button class="refreshBtn" onclick="renderStaffDetail(true)">&#8635; Refresh</button>
  </div>
  <h2 id="itStaffName"></h2>

  <label>Filter by Quantity</label>
  <div id="qtyChips" class="chipRow"></div>

  <div class="tableWrap">
    <table>
      <thead>
        <tr><th>Department</th><th>Product Code</th><th>Qty</th><th>Time</th></tr>
      </thead>
      <tbody id="entryRows"></tbody>
    </table>
  </div>
  <div id="itEmpty" class="empty" style="display:none">No entries.</div>

  <button id="copyBatchBtn" onclick="copyBatch()">Copy Batch (Product Codes)</button>
  <button class="dangerBtn" onclick="clearStaffData()">Clear All Data for This Staff</button>

  <div id="itStatus" style="display:none;margin-top:15px;padding:10px;border-radius:8px;text-align:center"></div>
</div>

<script>
//========================================
// CONFIG
//========================================
// Paste the /exec URL from your deployed Apps Script Web App below.
const API_URL = "https://script.google.com/macros/s/AKfycby4vP80h3Q7TSiw7zCcDhvujS7M-t9qn7GKcKdF3DPV6wJ1a57O6Ai78LG11sImPYc/exec";

const DEPARTMENTS = ["Food", "Nonfood", "Fresh Market", "Hardline", "Softline"];

let currentDepartment = "";
let currentStaff = "";
let currentQtyFilter = null; // null = All
let entriesCache = [];

//========================================
// SERVER HELPERS
// The server caches "list"/"summary" reads for ~20s (see CACHE_TTL_SECONDS
// in Code.gs), so plain loads are fast. Pass force=true to bypass that
// cache when the data must be current right now (manual Refresh taps).
//========================================
async function fetchSummary(force) {
  const url = API_URL + "?action=summary" + (force ? "&nocache=1" : "");
  const res = await fetch(url);
  const data = await res.json();
  if (!data.success) throw new Error(data.message || "Failed to load data.");
  return data.staff || []; // [{ staffName, count }]
}

async function fetchStaffEntries(name, force) {
  const url = API_URL + "?action=list&staff=" + encodeURIComponent(name) + (force ? "&nocache=1" : "");
  const res = await fetch(url);
  const data = await res.json();
  if (!data.success) throw new Error(data.message || "Failed to load data.");
  entriesCache = data.entries || [];
  return entriesCache;
}

async function postToServer(payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return res.json();
}

function getEntriesForStaff(name) {
  // entriesCache only ever holds the currently opened staff's rows
  return entriesCache.filter(e => e.staffName === name);
}

//========================================
// TOP NAV
//========================================
function switchTab(tab) {
  document.getElementById("tabDept").classList.toggle("active", tab === "dept");
  document.getElementById("tabIT").classList.toggle("active", tab === "it");

  if (tab === "dept") {
    showDeptSelect();
  } else {
    showITList();
  }
}

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

//========================================
// DEPARTMENT FLOW
//========================================
function initDeptButtons() {
  const container = document.getElementById("deptButtons");
  container.innerHTML = "";
  DEPARTMENTS.forEach(d => {
    const b = document.createElement("button");
    b.textContent = d;
    b.onclick = () => selectDepartment(d);
    container.appendChild(b);
  });
}

async function selectDepartment(dept) {
  currentDepartment = dept;
  document.getElementById("deptName").textContent = dept;
  document.getElementById("status").style.display = "none";
  showView("view-dept-form");
  try {
    const staff = await fetchSummary(false);
    refreshStaffDatalist(staff.map(s => s.staffName));
  } catch (e) {
    // datalist just won't have suggestions if this fails; not fatal
  }
}

function showDeptSelect() {
  showView("view-dept-select");
}

function refreshStaffDatalist(names) {
  const list = document.getElementById("staffList");
  list.innerHTML = "";
  names.forEach(n => {
    const o = document.createElement("option");
    o.value = n;
    list.appendChild(o);
  });
}

async function submitForm() {
  const status = document.getElementById("status");
  status.style.display = "none";

  const staffName = document.getElementById("staffName").value.trim();
  const productCode = document.getElementById("productCode").value.trim();
  const quantity = Number(document.getElementById("quantity").value);

  if (staffName === "") {
    return showStatus(status, false, "Please enter Staff Name.");
  }
  if (productCode === "") {
    return showStatus(status, false, "Please scan Product Code.");
  }
  if (!(quantity > 0)) {
    return showStatus(status, false, "Quantity must be at least 1.");
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  try {
    const result = await postToServer({
      action: "submit",
      staffName,
      department: currentDepartment,
      productCode,
      quantity
    });

    if (result.success) {
      showStatus(status, true, result.message + " (" + result.timestamp + ")");
      document.getElementById("productCode").value = "";
      document.getElementById("quantity").value = 1;
      document.getElementById("productCode").focus();
    } else {
      showStatus(status, false, result.message);
    }
  } catch (e) {
    showStatus(status, false, "Connection error. Please try again.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
  }
}

function showStatus(el, success, message) {
  el.style.display = "block";
  el.className = success ? "success" : "error";
  el.innerHTML = (success ? "\u2713 " : "\u2717 ") + message;
}

//========================================
// IT ENTRY: STAFF LIST
//========================================
async function showITList(force) {
  showView("view-it-list");
  const container = document.getElementById("staffListContainer");
  container.innerHTML = '<div class="loading">Loading...</div>';

  let staff;
  try {
    staff = await fetchSummary(!!force);
  } catch (e) {
    container.innerHTML = '<div class="empty">Could not load data. Check your connection and tap Refresh.</div>';
    return;
  }

  container.innerHTML = "";

  if (staff.length === 0) {
    container.innerHTML = '<div class="empty">No submissions yet.</div>';
  } else {
    staff.forEach(s => {
      const b = document.createElement("button");
      b.className = "listItem";
      b.innerHTML = escapeHtml(s.staffName) + '<span class="count">' + s.count + "</span>";
      b.onclick = () => openStaffDetail(s.staffName);
      container.appendChild(b);
    });
  }
}

//========================================
// IT ENTRY: STAFF DETAIL
//========================================
async function openStaffDetail(name) {
  currentStaff = name;
  currentQtyFilter = null;
  document.getElementById("itStaffName").textContent = name;
  document.getElementById("itStatus").style.display = "none";
  document.getElementById("qtyChips").innerHTML = "";
  document.getElementById("entryRows").innerHTML = "";
  document.getElementById("itEmpty").style.display = "none";
  showView("view-it-detail");

  try {
    await fetchStaffEntries(name, false);
  } catch (e) {
    document.getElementById("itStatus").style.display = "block";
    document.getElementById("itStatus").className = "error";
    document.getElementById("itStatus").innerHTML = "\u2717 Could not load entries. Check your connection.";
    return;
  }

  renderStaffDetail(false);
}

async function renderStaffDetail(refetch) {
  if (refetch) {
    document.getElementById("entryRows").innerHTML = "";
    document.getElementById("itEmpty").style.display = "none";
    try {
      await fetchStaffEntries(currentStaff, true);
    } catch (e) {
      document.getElementById("itStatus").style.display = "block";
      document.getElementById("itStatus").className = "error";
      document.getElementById("itStatus").innerHTML = "\u2717 Could not refresh. Check your connection.";
      return;
    }
  }

  const entries = getEntriesForStaff(currentStaff);

  // quantity filter chips
  const quantities = [...new Set(entries.map(e => e.quantity))].sort((a, b) => a - b);
  const chipRow = document.getElementById("qtyChips");
  chipRow.innerHTML = "";

  const allChip = document.createElement("div");
  allChip.className = "chip" + (currentQtyFilter === null ? " active" : "");
  allChip.textContent = "All";
  allChip.onclick = () => { currentQtyFilter = null; renderStaffDetail(false); };
  chipRow.appendChild(allChip);

  quantities.forEach(q => {
    const chip = document.createElement("div");
    chip.className = "chip" + (currentQtyFilter === q ? " active" : "");
    chip.textContent = "Qty " + q;
    chip.onclick = () => { currentQtyFilter = q; renderStaffDetail(false); };
    chipRow.appendChild(chip);
  });

  // filtered rows
  const filtered = currentQtyFilter === null
    ? entries
    : entries.filter(e => e.quantity === currentQtyFilter);

  const tbody = document.getElementById("entryRows");
  tbody.innerHTML = "";
  document.getElementById("itEmpty").style.display = filtered.length === 0 ? "block" : "none";

  filtered.forEach(e => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + escapeHtml(e.department) + "</td>" +
      "<td>" + escapeHtml(e.productCode) + "</td>" +
      "<td>" + e.quantity + "</td>" +
      "<td>" + escapeHtml(e.timestamp) + "</td>";
    tbody.appendChild(tr);
  });

  document.getElementById("copyBatchBtn").textContent =
    "Copy Batch (" + filtered.length + " code" + (filtered.length === 1 ? "" : "s") + ")";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function copyBatch() {
  const entries = getEntriesForStaff(currentStaff);
  const filtered = currentQtyFilter === null
    ? entries
    : entries.filter(e => e.quantity === currentQtyFilter);

  const codes = filtered.map(e => e.productCode).join("\n");
  const status = document.getElementById("itStatus");

  if (filtered.length === 0) {
    status.style.display = "block";
    status.className = "error";
    status.innerHTML = "\u2717 Nothing to copy for this filter.";
    return;
  }

  const done = () => {
    status.style.display = "block";
    status.className = "success";
    status.innerHTML = "\u2713 Copied " + filtered.length + " product code(s).";
  };
  const fail = () => {
    status.style.display = "block";
    status.className = "error";
    status.innerHTML = "\u2717 Could not copy automatically. Long-press to copy manually.";
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(codes).then(done).catch(fail);
  } else {
    try {
      const ta = document.createElement("textarea");
      ta.value = codes;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) {
      fail();
    }
  }
}

async function clearStaffData() {
  const confirmed = confirm(
    "Clear ALL submitted data for \"" + currentStaff + "\"? This cannot be undone."
  );
  if (!confirmed) return;

  const status = document.getElementById("itStatus");
  try {
    const result = await postToServer({ action: "clearStaff", staffName: currentStaff });
    if (!result.success) {
      status.style.display = "block";
      status.className = "error";
      status.innerHTML = "\u2717 " + (result.message || "Could not clear data.");
      return;
    }
    showITList();
  } catch (e) {
    status.style.display = "block";
    status.className = "error";
    status.innerHTML = "\u2717 Connection error. Please try again.";
  }
}

//========================================
// INIT
//========================================
initDeptButtons();
</script>

</body>
</html>
